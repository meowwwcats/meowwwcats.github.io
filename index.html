<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에임 루틴</title>
    <style>
        /* [기본 설정 및 디자인] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { 
            background-color: #020202; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
            overflow: hidden;
            position: relative;
            /* 텍스트 선택 방지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* [발로란트 스킨 배경 이미지 (패럴랙스 효과)] */
        #bg-skins {
            position: fixed;
            top: -10%; left: -10%; 
            width: 120%; height: 120%;
            background-image: 
                url('https://images.contentstack.io/v3/assets/bltb6530b271fddd0b1/blt6d57ff5c99464e8a/5ee98935c6e8346b0d9e79f6/V_Skin_Prime_Vandal_1.png'),
                url('https://images.contentstack.io/v3/assets/bltb6530b271fddd0b1/blta44d935b0e51532f/5f20a9a838542b23a7e53f19/V_Skin_Oni_Phantom.png'),
                url('https://images.contentstack.io/v3/assets/bltb6530b271fddd0b1/blt7241be742d4808c1/5f80b2d6a540166299d2551e/V_Skin_Ion_Sheriff.png'),
                url('https://images.contentstack.io/v3/assets/bltb6530b271fddd0b1/bltf5a796e680e6c535/606553259834160fbd9c490a/V_Skin_Magepunk_Ghost.png');
            background-position: 
                top 15% left 10%, 
                bottom 10% right 10%, 
                top 20% right 15%, 
                bottom 20% left 15%;
            background-repeat: no-repeat;
            background-size: 400px auto; 
            opacity: 0.1; /* 더 극적인 효과를 위해 약간 더 어둡게 */
            z-index: -2; /* 눈 효과보다 아래 배치 */
            transition: transform 0.1s ease-out; 
        }

        /* [로딩 화면 스타일] */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #0f1923;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            background-color: #ff4655;
            margin-bottom: 30px;
            clip-path: polygon(20% 0%, 0% 20%, 0% 100%, 80% 100%, 100% 80%, 100% 0%);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .loading-text {
            font-size: 14px;
            letter-spacing: 5px;
            color: #ece8e1;
            margin-bottom: 15px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .progress-container {
            width: 300px;
            height: 2px;
            background-color: rgba(236, 232, 225, 0.1);
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background-color: #ff4655;
            box-shadow: 0 0 15px #ff4655;
            transition: width 0.1s linear;
        }

        .loading-status {
            margin-top: 10px;
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
        }

        /* [메인 컨텐츠 스타일] */
        .mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(255, 70, 85, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        /* [수정] 스킨 이미지가 내리는 캔버스 */
        #skin-shower-canvas { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: -1; /* 마우스 글로우보단 아래, 배경보단 위 */
            pointer-events: none; 
        }
        
        .container {
            position: relative;
            background-color: rgba(8, 8, 8, 0.9); 
            width: 550px; 
            border-radius: 30px; 
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 1);
            backdrop-filter: blur(25px);
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .container.show { opacity: 1; transform: translateY(0); }

        .header { text-align: center; margin-bottom: 35px; }
        .header h1 { font-size: 42px; font-weight: 900; letter-spacing: 8px; color: #ff4655; text-shadow: 0 0 30px rgba(255, 70, 85, 0.4); }
        .header p { color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 4px; margin-top: 8px; }

        .task-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .task-item {
            background-color: rgba(18, 18, 18, 0.8); border-radius: 20px; padding: 20px 25px;
            display: flex; flex-direction: column; gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative; white-space: nowrap;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 70, 85, 0.1); border-color: rgba(255, 70, 85, 0.2); }
            50% { box-shadow: 0 0 25px rgba(255, 70, 85, 0.4); border-color: rgba(255, 70, 85, 0.6); background-color: rgba(28, 20, 20, 0.9); }
        }
        .task-item.active { animation: breathe 3s infinite ease-in-out; transform: scale(1.03); z-index: 11; }
        .task-top { display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-size: 16px; font-weight: 600; color: #ddd; letter-spacing: -0.5px; }
        .individual-timer { font-size: 15px; color: #ff4655; font-weight: 800; font-family: 'Courier New', monospace; letter-spacing: 1px; }

        .btn-group { display: flex; gap: 8px; }
        button { border: none; border-radius: 10px; padding: 10px 15px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.3s; outline: none; }
        .btn-white { background-color: #ece8e1; color: #0f1923; box-shadow: 0 3px 0 #c2beb6; }
        .btn-dark { background-color: #222; color: #777; }
        .locked { opacity: 0.05; filter: blur(2px); pointer-events: none; }
        .completed { opacity: 0.3; filter: grayscale(1); }
        .completed .task-title { color: #555; text-decoration: line-through; }
        button:disabled { opacity: 0.1; cursor: not-allowed; }

        .btn-total {
            width: 100%; background-color: #ff4655; color: #fff; font-size: 16px;
            font-weight: 800; padding: 22px; border-radius: 16px; cursor: pointer; border: none;
            transition: 0.4s; margin-top: 10px; text-transform: uppercase; letter-spacing: 3px;
        }
        .total-display { text-align: center; font-size: 84px; font-weight: 900; margin-top: 25px; color: #fff; font-family: 'Courier New', monospace; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<div id="bg-skins"></div>

<div id="loading-screen">
    <div class="loading-logo"></div>
    <div class="loading-text">보안 시스템 가동중</div>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="loading-status" id="loading-status">데이터 보호 프로토콜 실행중</div>
</div>

<div class="mouse-glow" id="glow"></div>
<canvas id="skin-shower-canvas"></canvas>

<div class="container" id="main-container">
    <div class="header">
        <h1>발로란트</h1>
        <p>에임 연습 리스트</p>
    </div>

    <div class="task-list">
        <div class="task-item" id="task-0">
            <div class="task-top">
                <span class="task-title">에임랩 그리드샷 15분 플레이</span>
                <div class="btn-group">
                    <button class="btn-white" onclick="startTimer(0)">시작</button>
                    <button class="btn-dark" onclick="pauseTimer(0)">일시정지</button>
                </div>
            </div>
            <div class="individual-timer" id="timer-0">00:00:00</div>
        </div>

        <div class="task-item locked" id="task-1">
            <div class="task-top">
                <span class="task-title">어려움 봇 20개 이상 3번 파괴</span>
                <div class="btn-group">
                    <button class="btn-white" onclick="startTimer(1)" disabled>시작</button>
                    <button class="btn-dark" onclick="pauseTimer(1)" disabled>일시정지</button>
                    <button class="btn-white" onclick="completeTimer(1)" disabled>완료</button>
                </div>
            </div>
            <div class="individual-timer" id="timer-1">00:00:00</div>
        </div>

        <div class="task-item locked" id="task-2">
            <div class="task-top">
                <span class="task-title">데스매치 3번 승리 하기</span>
                <div class="btn-group">
                    <button class="btn-white" onclick="startTimer(2)" disabled>시작</button>
                    <button class="btn-dark" onclick="pauseTimer(2)" disabled>일시정지</button>
                    <button class="btn-white" onclick="completeTimer(2)" disabled>완료</button>
                </div>
            </div>
            <div class="individual-timer" id="timer-2">00:00:00</div>
        </div>

        <div class="task-item locked" id="task-3">
            <div class="task-top">
                <span class="task-title">경쟁전 3판 플레이 하기</span>
                <div class="btn-group">
                    <button class="btn-white" onclick="startTimer(3)" disabled>시작</button>
                    <button class="btn-dark" onclick="pauseTimer(3)" disabled>일시정지</button>
                    <button class="btn-white" onclick="completeTimer(3)" disabled>완료</button>
                </div>
            </div>
            <div class="individual-timer" id="timer-3">00:00:00</div>
        </div>
    </div>

    <button class="btn-total" onclick="calculateTotal()">총합 시간 확인 하기</button>
    <div class="total-display" id="total-display">00:00:00</div>
</div>

<script>
    /* [보안 강화 스크립트 (막기 기능 유지)] */
    window.addEventListener('keydown', function (e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; } // F12
        if (e.keyCode === 116 || (e.ctrlKey && e.keyCode === 82)) { e.preventDefault(); return false; } // F5, Ctrl+R
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; } // DevTools
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; } // Ctrl+U
    });
    document.addEventListener('contextmenu', e => e.preventDefault()); // 우클릭

    /* [로딩 시뮬레이션] */
    window.addEventListener('load', () => {
        const progressBar = document.getElementById('progress-bar');
        const loadingStatus = document.getElementById('loading-status');
        const loadingScreen = document.getElementById('loading-screen');
        const mainContainer = document.getElementById('main-container');
        
        let progress = 0;
        const statusMsgs = ["보안 프로토콜 로드 중...", "루틴 데이터 암호화 해제 중...", "UI 에셋 최적화 중...", "연습 환경 구성 중...", "준비 완료"];
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 12;
            if (progress > 100) progress = 100;
            progressBar.style.width = progress + '%';
            const msgIdx = Math.floor((progress / 100) * statusMsgs.length);
            if(statusMsgs[msgIdx]) loadingStatus.innerText = statusMsgs[msgIdx];
            if (progress === 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.visibility = 'hidden';
                    mainContainer.classList.add('show');
                }, 600);
            }
        }, 120);
    });

    /* [기존 인터랙션 & 타이머 로직] */
    const glow = document.getElementById('glow');
    const bgSkins = document.getElementById('bg-skins');

    // [수정] 스킨 이미지 흩날리기 효과를 위한 이미지 URL 리스트
    const fallingSkinUrls = [
        'https://valorantinfo.com/images/kr/evori-dreamwings-vandal-level-4variant-2-pink_valorant_full_skin_1488504.webp', // 프라임 벤달
        'https://static.wikia.nocookie.net/valorant/images/0/08/Ion_Sheriff.png/revision/latest?cb=20230711195922', // 이온 셰리프
        'https://valorantinfo.com/images/kr/splashx-vandal_valorant_full_skin_2407829.webp',
        'https://c-valorant-api.op.gg/Assets/WeaponSkins/296D373F-4838-5712-D8D4-EAAF5CFABE79.png?image=q_auto:good,f_webp,w_300&v=1778114260',
    ];

    // 이미지 엘리먼트 사전 로드
    const loadedSkinImages = fallingSkinUrls.map(url => {
        const img = new Image();
        img.src = url;
        return img;
    });

    window.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
        const moveX = (e.clientX - window.innerWidth / 2) / 50;
        const moveY = (e.clientY - window.innerHeight / 2) / 50;
        bgSkins.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });

    // [수정] 눈 -> 스킨 샤워 효과 캔버스 로직
    const canvas = document.getElementById('skin-shower-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, skins = []; // snowflakes -> skins

    function initSkinShower() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        skins = [];
        // 이미지 개수를 눈송이보다 줄여서 렉 방지 및 가독성 확보
        for (let i = 0; i < 30; i++) { 
            skins.push({ 
                x: Math.random() * width, 
                y: Math.random() * height, 
                opacity: Math.random() * 0.2 + 0.05, // 배경 스킨보다 더 연하게 처리
                // 랜덤 스킨 이미지 할당
                imageIdx: Math.floor(Math.random() * loadedSkinImages.length),
                // 이미지 크기를 랜덤하게 (약간 작게)
                scale: Math.random() * 0.15 + 0.1, 
                // 수직 낙하 속도 (눈보다 살짝 무겁게)
                speedY: Math.random() * 0.8 + 0.3, 
                // 랜덤한 좌우 흔들림 감도
                speedX: Math.random() * 0.4 - 0.2, 
                // 랜덤한 회전 효과 추가
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: Math.random() * 0.005 - 0.0025
            });
        }
    }

    function drawSkinShower() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < skins.length; i++) {
            let p = skins[i];
            const img = loadedSkinImages[p.imageIdx];
            
            // 이미지 로딩 완료 확인
            if (!img.complete) continue;

            ctx.save(); // 현재 캔버스 상태 저장

            // 회전 및 위치 변환
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.globalAlpha = p.opacity; // 투명도 적용

            // 이미지 그리기 (중심점을 기준으로 크기 조절)
            const drawWidth = img.width * p.scale;
            const drawHeight = img.height * p.scale;
            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

            ctx.restore(); // 이전 캔버스 상태 복원
        }
        updateSkinShower();
    }

    function updateSkinShower() {
        for (let i = 0; i < skins.length; i++) {
            let p = skins[i]; 
            p.y += p.speedY; 
            // 살짝 흔들림 효과
            p.x += p.speedX + Math.sin(p.y / 80) * 0.2;
            p.rotation += p.rotationSpeed; // 회전 업데이트

            // 화면 하단 돌파 시 상단으로 재배치
            if (p.y > height + 50) { 
                p.y = -50; 
                p.x = Math.random() * width; 
            }
            // 좌우 화면 돌파 시 반대편 재배치
            if (p.x > width + 50) p.x = -50;
            if (p.x < -50) p.x = width + 50;
        }
        requestAnimationFrame(drawSkinShower);
    }

    window.addEventListener('resize', initSkinShower);
    // 이미지 로딩 여유를 두고 실행
    setTimeout(() => {
        initSkinShower(); 
        drawSkinShower();
    }, 100);

    function playChimeSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [{ freq: 523.25, delay: 0 }, { freq: 659.25, delay: 0.05 }];
        notes.forEach(note => {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.delay);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime + note.delay);
            gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + note.delay + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.delay + 1.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(audioCtx.currentTime + note.delay);
            oscillator.stop(audioCtx.currentTime + note.delay + 1.5);
        });
    }

    let times = [0, 0, 0, 0], intervals = [null, null, null, null], isCompleted = [false, false, false, false];

    function formatFullTime(s) {
        const h = Math.floor(s / 3600).toString().padStart(2, '0');
        const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
        const rs = (s % 60).toString().padStart(2, '0');
        return `${h}:${m}:${rs}`;
    }

    function startTimer(idx) {
        if (isCompleted[idx] || (idx > 0 && !isCompleted[idx - 1]) || intervals[idx]) return;
        document.getElementById(`task-${idx}`).classList.add('active');
        intervals[idx] = setInterval(() => {
            times[idx]++;
            document.getElementById(`timer-${idx}`).innerText = formatFullTime(times[idx]);
            if (idx === 0 && times[0] >= 900) { completeTimer(0); }
        }, 1000);
    }

    function pauseTimer(idx) {
        document.getElementById(`task-${idx}`).classList.remove('active');
        clearInterval(intervals[idx]); intervals[idx] = null;
    }

    function completeTimer(idx) {
        if (isCompleted[idx]) return;
        playChimeSound();
        pauseTimer(idx);
        isCompleted[idx] = true;
        const taskItem = document.getElementById(`task-${idx}`);
        taskItem.classList.remove('active');
        taskItem.classList.add('completed');
        taskItem.querySelectorAll('button').forEach(btn => btn.disabled = true);
        if (idx < 3) {
            const next = document.getElementById(`task-${idx + 1}`);
            next.classList.remove('locked');
            next.querySelectorAll('button').forEach(btn => btn.disabled = false);
        }
    }

    function calculateTotal() {
        intervals.forEach((_, i) => pauseTimer(i));
        const total = times.reduce((a, b) => a + b, 0);
        document.getElementById('total-display').innerText = formatFullTime(total);
    }
</script>
</body>
</html>
