<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야옹이 루틴 페이지</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+KR:wght@300;700;900&display=swap');

        /* 모바일 차단 */
        #mobile-block { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #060606; z-index: 9999; color: white; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Noto Sans KR'; padding: 20px; }
        @media (max-width: 1024px) { #mobile-block { display: flex; } body { overflow: hidden; } }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
        body { background-color: #060606; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; font-family: 'Noto Sans KR', sans-serif; }
        
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .mouse-glow { position: fixed; top: 0; left: 0; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 70, 85, 0.08) 0%, rgba(0, 0, 0, 0) 75%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 1; }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #060606; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .loader { width: 50px; height: 50px; border: 3px solid rgba(255, 70, 85, 0.2); border-top-color: #ff4655; border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .container { position: relative; width: 850px; max-height: 85vh; padding: 40px; border-radius: 40px; background: rgba(15, 25, 35, 0.95); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.08); z-index: 10; display: flex; flex-direction: column; opacity: 0; transform: translateY(20px); transition: 0.8s; }
        .container.show { opacity: 1; transform: translateY(0); }

        .header h1 { font-size: 24px; font-weight: 900; letter-spacing: 5px; text-align: center; margin-bottom: 30px; color: #ff4655; text-shadow: 0 0 20px rgba(255, 70, 85, 0.4); font-family: 'Orbitron'; flex-shrink: 0; }

        .task-list { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 15px; margin-bottom: 20px; scroll-behavior: smooth; }
        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-thumb { background: #ff4655; border-radius: 10px; }

        .task-item { background: rgba(255, 255, 255, 0.02); border-radius: 24px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; }
        .task-item.active { background: rgba(255, 70, 85, 0.1); border-color: rgba(255, 70, 85, 0.5); }
        .task-item.completed { opacity: 0.3; filter: grayscale(1); pointer-events: none !important; }
        .task-item.locked .btn-group { opacity: 0.2; pointer-events: none; }

        .task-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .task-title { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
        .edit-btn { cursor: pointer; color: #ff4655; font-size: 11px; font-weight: 900; padding: 4px 12px; border-radius: 6px; background: rgba(255, 70, 85, 0.1); transition: 0.2s; }

        .btn-group { display: flex; gap: 12px; }
        button { border: none; border-radius: 12px; height: 45px; min-width: 90px; font-size: 14px; font-weight: 900; cursor: pointer; transition: 0.2s; font-family: 'Noto Sans KR'; }
        .btn-start { background: #ece8e1; color: #0f1923; }
        .btn-stop { background: #333; color: #fff; }
        .btn-clear { background: #ff4655; color: #fff; }
        button:disabled { opacity: 0.1; cursor: not-allowed; }

        .display-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .timer-val { font-family: 'Orbitron', sans-serif; font-size: 40px; color: #fff; font-weight: 900; }
        .tag { font-size: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); margin-left: 5px; font-family: 'Orbitron'; }
        .tag.on { border-color: rgba(255, 70, 85, 0.5); color: #ff4655; background: rgba(255, 70, 85, 0.1); }

        /* 설정 패널 - 격리 강화 */
        .settings-panel { display: none; margin-top: 20px; padding: 30px; background: rgba(0,0,0,0.85); border-radius: 25px; border: 1px solid rgba(255, 70, 85, 0.4); animation: fadeIn 0.2s ease; }
        .title-input { width: 100%; background: #111; border: 2px solid #222; color: #fff; padding: 14px; border-radius: 12px; margin-bottom: 20px; font-size: 16px; outline: none; }
        
        .mode-select { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 12px; border-radius: 10px; background: #111; border: 2px solid #222; color: #444; font-size: 12px; font-weight: 900; text-align: center; cursor: pointer; }
        .mode-btn.active { border-color: #ff4655 !important; color: #fff !important; background: rgba(255, 70, 85, 0.2) !important; }

        /* 시간/횟수 선택 섹션 */
        .control-section { display: none; }
        .control-section.active { display: block; }

        .stepper-group { display: flex; flex-direction: column; gap: 12px; }
        .stepper { display: flex; align-items: center; gap: 10px; background: #000; padding: 12px; border-radius: 15px; border: 1px solid #222; }
        
        /* 버튼 위치: 왼쪽(+), 오른쪽(-) */
        .step-btn { width: 38px; height: 38px; border-radius: 8px; background: #222; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .step-btn:hover { background: #333; color: #ff4655; }
        
        .step-input { flex: 1; background: transparent; border: none; text-align: center; font-family: 'Orbitron'; font-size: 22px; color: #ff4655; font-weight: 900; width: 45px; outline: none; }
        .step-unit { font-size: 11px; color: #555; font-weight: 900; min-width: 20px; }

        .btn-add { width: 100%; height: 60px; background: transparent; border: 2px dashed rgba(255, 70, 85, 0.3); border-radius: 20px; color: #ff4655; font-size: 14px; font-weight: 900; flex-shrink: 0; cursor: pointer; transition: 0.2s; font-family: 'Orbitron'; }
        .footer { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px; text-align: center; flex-shrink: 0; }
        .total-time { font-family: 'Orbitron', sans-serif; font-size: 56px; font-weight: 900; color: #fff; margin-bottom: 15px; }
        .btn-admin { background: transparent; border: 1px solid #333; color: #444; padding: 10px 20px; border-radius: 10px; font-size: 11px; cursor: pointer; margin: 0 5px; }
    </style>
</head>
<body>

<div id="mobile-block">
    <h1 style="font-family: 'Orbitron'; color: #ff4655; margin-bottom: 20px;">접속 불가</h1>
    <p>본 앱은 <b>PC 데스크탑</b> 전용입니다.</p>
</div>

<div id="loading-screen">
    <div class="loader"></div>
    <div style="font-family: 'Orbitron'; letter-spacing: 5px; font-size: 12px; color: #ff4655;">유저의 데이터 베이스를 불러오고 있습니다.</div>
</div>

<canvas id="snow-canvas"></canvas>
<div class="mouse-glow" id="glow"></div>

<div class="container" id="main-container">
    <div class="header"><h1>에임루틴 리스트</h1></div>
    <div id="task-list" class="task-list"></div>
    
    <button class="btn-add" onclick="addNewTask()">+ 새로운 루틴 추가 하기</button>

    <div class="footer">
        <div style="font-size: 11px; color: #ff4655; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px;">총 연습 시간</div>
        <div class="total-time" id="total-display">00:00:00</div>
        <div style="display:flex; justify-content: center;">
            <button class="btn-admin" onclick="resetProgress()">다시하기</button>
            <button class="btn-admin" onclick="factoryReset()">루틴 초기화</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'VALO_ROUTINE_V31_PC';
    let routines = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
        { id: 1, title: "에임랩 15분 플레이 하기", currentSec: 0, completed: false, useTime: true, useCount: false, useMatch: false, goalH: 0, goalM: 15, goalS: 0, goalCount: 0, goalMatch: 0 }
    ];
    let intervals = {};
    let openPanelIdx = null; 

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

    function playCuteSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(routines)); }

    function formatTime(s) {
        const h = Math.floor(s/3600).toString().padStart(2,'0'), m = Math.floor((s%3600)/60).toString().padStart(2,'0'), rs = (s%60).toString().padStart(2,'0');
        return `${h}:${m}:${rs}`;
    }

    function render() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const firstActiveIdx = routines.findIndex(r => !r.completed);

        routines.forEach((task, i) => {
            const isRunning = !!intervals[task.id];
            const isLocked = i > firstActiveIdx && firstActiveIdx !== -1;
            const canStart = (task.useTime && (task.goalH * 3600 + task.goalM * 60 + task.goalS > 0)) || (task.useCount && task.goalCount > 0) || (task.useMatch && task.goalMatch > 0);

            const item = document.createElement('div');
            item.className = `task-item ${isLocked ? 'locked' : ''} ${task.completed ? 'completed' : ''} ${isRunning ? 'active' : ''}`;
            const clearBtnHtml = !task.useTime ? `<button class="btn-clear" onclick="completeTask(${i})" ${isRunning ? '' : 'disabled'}>완료</button>` : '';

            item.innerHTML = `
                <div class="task-main">
                    <div>
                        <span class="task-title" id="title-display-${i}">${task.title}</span>
                        ${!task.completed ? `<span class="edit-btn" onclick="toggleSettings(${i})">⚙ 설정</span>` : ''}
                    </div>
                    <div class="btn-group">
                        <button class="${isRunning ? 'btn-stop' : 'btn-start'}" onclick="handleToggle(${i})" ${!isRunning && !canStart ? 'disabled' : ''}>
                            ${isRunning ? '중지' : '시작'}
                        </button>
                        ${clearBtnHtml}
                    </div>
                </div>
                <div class="display-row">
                    <div class="timer-val" id="timer-${task.id}">${formatTime(task.currentSec)}</div>
                    <div>
                        ${task.useTime ? `<span class="tag on">타이머 : ${task.goalH} 시간 ${task.goalM} 분 ${task.goalS} 초</span>` : ''}
                        ${task.useCount ? `<span class="tag on">횟수 : ${task.goalCount} 개</span>` : ''}
                        ${task.useMatch ? `<span class="tag on">판수 : ${task.goalMatch} 판</span>` : ''}
                    </div>
                </div>
                <div class="settings-panel" id="panel-${i}" style="display: ${openPanelIdx === i ? 'block' : 'none'}">
                    <input type="text" class="title-input" value="${task.title}" oninput="updateTitleRealtime(${i}, this.value)" placeholder="이름 변경">
                    
                    <div class="mode-select">
                        <div class="mode-btn ${task.useTime?'active':''}" onclick="setMainMode(${i}, 'time')">시간 목표</div>
                        <div class="mode-btn ${!task.useTime?'active':''}" onclick="setMainMode(${i}, 'count')">횟수 목표</div>
                    </div>

                    <div class="control-section ${task.useTime?'active':''}">
                        <div class="stepper-group">
                            <div class="stepper">
                                <span class="step-unit">시간</span>
                                <div class="step-btn" onclick="adj(${i},'goalH',1)">+</div>
                                <input type="number" class="step-input" value="${task.goalH}" onchange="inputAdj(${i},'goalH',this.value)">
                                <div class="step-btn" onclick="adj(${i},'goalH',-1)">-</div>
                            </div>
                            <div class="stepper">
                                <span class="step-unit">분</span>
                                <div class="step-btn" onclick="adj(${i},'goalM',1)">+</div>
                                <input type="number" class="step-input" value="${task.goalM}" onchange="inputAdj(${i},'goalM',this.value)">
                                <div class="step-btn" onclick="adj(${i},'goalM',-1)">-</div>
                            </div>
                            <div class="stepper">
                                <span class="step-unit">초</span>
                                <div class="step-btn" onclick="adj(${i},'goalS',1)">+</div>
                                <input type="number" class="step-input" value="${task.goalS}" onchange="inputAdj(${i},'goalS',this.value)">
                                <div class="step-btn" onclick="adj(${i},'goalS',-1)">-</div>
                            </div>
                        </div>
                    </div>

                    <div class="control-section ${!task.useTime?'active':''}">
                        <div class="stepper-group">
                            <div class="stepper">
                                <div class="mode-btn ${task.useCount?'active':''}" style="flex:none; width:80px; margin-right:10px;" onclick="toggleSubOption(${i},'useCount')">횟수</div>
                                <div class="step-btn" onclick="adj(${i},'goalCount',1)">+</div>
                                <input type="number" class="step-input" value="${task.goalCount}" onchange="inputAdj(${i},'goalCount',this.value)">
                                <div class="step-btn" onclick="adj(${i},'goalCount',-1)">-</div>
                            </div>
                            <div class="stepper">
                                <div class="mode-btn ${task.useMatch?'active':''}" style="flex:none; width:80px; margin-right:10px;" onclick="toggleSubOption(${i},'useMatch')">판수</div>
                                <div class="step-btn" onclick="adj(${i},'goalMatch',1)">+</div>
                                <input type="number" class="step-input" value="${task.goalMatch}" onchange="inputAdj(${i},'goalMatch',this.value)">
                                <div class="step-btn" onclick="adj(${i},'goalMatch',-1)">-</div>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:25px">
                        <button style="flex:1; background:#ece8e1; color:#000; font-size:13px" onclick="toggleSettings(${i})">설정 완료</button>
                        <button style="flex:1; background:rgba(255,70,85,0.1); color:#ff4655; font-size:13px" onclick="deleteTask(${i})">루틴 삭제</button>
                    </div>
                </div>
            `;
            list.appendChild(item);
        });
        updateTotal();
        save();
    }

    function handleToggle(i) {
        initAudio();
        const t = routines[i];
        if (intervals[t.id]) { clearInterval(intervals[t.id]); delete intervals[t.id]; }
        else {
            const startTime = Date.now() - (t.currentSec * 1000);
            intervals[t.id] = setInterval(() => {
                const now = Date.now();
                t.currentSec = Math.floor((now - startTime) / 1000);
                const el = document.getElementById(`timer-${t.id}`);
                if(el) el.innerText = formatTime(t.currentSec);
                updateTotal();
                if(t.useTime) {
                    const goal = (t.goalH * 3600) + (t.goalM * 60) + t.goalS;
                    if(t.currentSec >= goal && goal > 0) completeTask(i);
                }
            }, 100);
        }
        render(); 
    }

    function addNewTask() {
        const newIdx = routines.length;
        routines.push({ id: Date.now(), title: "새로운 루틴", currentSec: 0, completed: false, useTime: true, useCount: false, useMatch: false, goalH: 0, goalM: 0, goalS: 0, goalCount: 0, goalMatch: 0 });
        openPanelIdx = newIdx;
        render();
        setTimeout(() => { const list = document.querySelector('.task-list'); list.scrollTop = list.scrollHeight; }, 50);
    }

    function setMainMode(i, mode) {
        if(mode === 'time') { routines[i].useTime = true; routines[i].useCount = false; routines[i].useMatch = false; }
        else { routines[i].useTime = false; routines[i].useCount = true; routines[i].useMatch = false; }
        render();
    }

    function toggleSubOption(i, key) {
        routines[i][key] = !routines[i][key];
        if(!routines[i].useCount && !routines[i].useMatch) routines[i][key] = true;
        render();
    }

    function updateTitleRealtime(i, val) { routines[i].title = val; document.getElementById(`title-display-${i}`).innerText = val; save(); }
    function deleteTask(i) { if(confirm("삭제하시겠습니까?")) { if(intervals[routines[i].id]) clearInterval(intervals[routines[i].id]); routines.splice(i, 1); openPanelIdx = null; render(); } }
    function completeTask(i) { const t = routines[i]; if(intervals[t.id]) { clearInterval(intervals[t.id]); delete intervals[t.id]; } t.completed = true; playCuteSound(); render(); }
    function toggleSettings(i) { openPanelIdx = (openPanelIdx === i) ? null : i; render(); }
    function adj(i, key, val) { routines[i][key] = Math.max(0, (routines[i][key] || 0) + val); if((key==='goalM'||key==='goalS') && routines[i][key]>=60) routines[i][key]=59; render(); }
    function inputAdj(i, key, val) { routines[i][key] = Math.max(0, parseInt(val) || 0); render(); }
    function updateTotal() { const total = routines.reduce((acc, curr) => acc + curr.currentSec, 0); document.getElementById('total-display').innerText = formatTime(total); }
    function resetProgress() { if(!confirm("초기화할까요?")) return; Object.keys(intervals).forEach(id => clearInterval(intervals[id])); intervals = {}; routines.forEach(r => { r.currentSec = 0; r.completed = false; }); openPanelIdx = null; render(); }
    function factoryReset() { if(confirm("전체 초기화됩니다.")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        setTimeout(() => { document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; document.getElementById('main-container').classList.add('show'); }, 500); }, 1000);
        const canvas = document.getElementById('snow-canvas'); const ctx = canvas.getContext('2d'); let flakes = [];
        function initSnow() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; flakes = []; for(let i=0; i<70; i++) flakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*2+1, d:Math.random()*0.4+0.2}); }
        function drawSnow() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.beginPath(); flakes.forEach(f => { ctx.moveTo(f.x,f.y); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); }); ctx.fill(); flakes.forEach(f => { f.y += f.d; if(f.y > canvas.height) f.y = -10; }); requestAnimationFrame(drawSnow); }
        initSnow(); drawSnow(); render();
    };

    window.addEventListener('mousemove', e => { const g = document.getElementById('glow'); if(g) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; } });

    document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

</script>
</body>
</html>
